<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG System Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
  <main class="chat-shell">
    <header class="chat-header">
      <div class="brand">
        <div class="brand-icon">
          <img src="{{ url_for('static', filename='images/agga_icon.png') }}" alt="AGGA Assistant icon">
        </div>
        <div>
          <h1>AGGA Assistant</h1>
          <p>Ask questions, search context, and get grounded answers.</p>
        </div>
      </div>
    </header>


    <!-- CHAT BODY  -->
    <section class="chat-body" id="chat-body">
      <article class="message bot">
        <div class="avatar">
          <img src="{{ url_for('static', filename='images/agga_icon.png') }}" alt="AGGA Assistant icon">
        </div>
        <div class="bubble">
          Hello, How can I help you?
        </div>
      </article>
    </section>

    <footer class="chat-input">
      <form class="upload-panel" id="upload-panel" enctype="multipart/form-data">
        <div class="upload-panel-header">
          <div>
            <strong>Upload a file</strong>
            <p>Select a document to send with the chat session.</p>
          </div>
          <button class="close-upload-btn" type="button" id="close-upload-panel" aria-label="Close upload panel">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <div class="upload-panel-body">
          <label class="file-picker" for="chat-file">
            <i class="fa-solid fa-file-arrow-up"></i>
            <span id="file-name">Choose a file</span>
          </label>
          <input type="file" id="chat-file" name="document" hidden>
          <button class="upload-btn" type="submit" id="upload-btn">Upload file</button>
        </div>
      </form>

      <form class="input-row">
        <button class="icon-btn" type="button" aria-label="Attach file" id="toggle-upload-panel" aria-expanded="false">
          <i class="fa-solid fa-paperclip"></i>
        </button>
        <input type="text" placeholder="Type your question here..." id="chat_message">
        <button class="send-btn" type="submit" aria-label="Send message" id="ask_message">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </form>
    </footer>
  </main>
</body>

<script>
  const chatForm = document.querySelector(".input-row");
  const chatBody = document.getElementById("chat-body");
  const chatMessageInput = document.getElementById("chat_message");
  const uploadPanel = document.getElementById("upload-panel");
  const toggleUploadPanelButton = document.getElementById("toggle-upload-panel");
  const closeUploadPanelButton = document.getElementById("close-upload-panel");
  const fileInput = document.getElementById("chat-file");
  const fileName = document.getElementById("file-name");
  const uploadButton = document.getElementById("upload-btn");
  const assistantAvatarSrc = "{{ url_for('static', filename='images/agga_icon.png') }}";

  function setUploadPanelState(isOpen) {
    uploadPanel.classList.toggle("is-open", isOpen);
    toggleUploadPanelButton.setAttribute("aria-expanded", isOpen ? "true" : "false");
  }

  function appendMessage(role, message) {
    const article = document.createElement("article");
    article.className = `message ${role}`;

    const avatar = document.createElement("div");
    avatar.className = "avatar";

    if (role === "user") {
      const icon = document.createElement("i");
      icon.className = "fa-solid fa-user";
      avatar.appendChild(icon);
    } else {
      const image = document.createElement("img");
      image.src = assistantAvatarSrc;
      image.alt = "AGGA Assistant icon";
      avatar.appendChild(image);
    }

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = message;

    article.appendChild(avatar);
    article.appendChild(bubble);

    chatBody.appendChild(article);
    chatBody.scrollTop = chatBody.scrollHeight;
  }

  toggleUploadPanelButton.addEventListener("click", () => {
    const shouldOpen = !uploadPanel.classList.contains("is-open");
    setUploadPanelState(shouldOpen);
  });

  closeUploadPanelButton.addEventListener("click", () => {
    setUploadPanelState(false);
  });

  fileInput.addEventListener("change", () => {
    fileName.textContent = fileInput.files.length ? fileInput.files[0].name : "Choose a file";
  });

  uploadPanel.addEventListener("submit", async (e) => {
    e.preventDefault();

    if (!fileInput.files.length) {
      appendMessage("bot", "Please choose a file before uploading.");
      return;
    }

    const selectedFile = fileInput.files[0];
    const formData = new FormData();
    formData.append("document", selectedFile);

    uploadButton.disabled = true;
    uploadButton.textContent = "Uploading...";

    const result = await uploadFile(formData);

    uploadButton.disabled = false;
    uploadButton.textContent = "Upload file";

    if (result && result.status === "Success") {
      appendMessage("user", `Uploaded file: ${selectedFile.name}`);
      appendMessage("bot", result.message);
      uploadPanel.reset();
      fileName.textContent = "Choose a file";
      setUploadPanelState(false);
      return;
    }

    appendMessage("bot", "Sorry, the file upload failed.");
  });

  chatForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = chatMessageInput.value.trim();

    if (!message) {
      return;
    }

    appendMessage("user", message);
    chatMessageInput.value = "";

    const payload = {
      message: message
    };

    const result = await go_ask(payload);
    if (result && result.status === "Success") {
      appendMessage("bot", result.response);
    } else {
      appendMessage("bot", "Sorry, I couldn't get a response right now.");
    }
  });


  async function go_ask(payload) {
    try {
      const res = await fetch("/ask", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });

      // check error
      if (!res.ok) {
        throw new Error("Request failed");
      }

      return await res.json();

    } catch (err) {
      console.error(err);
      return null;
    }
  }

  async function uploadFile(formData) {
    try {
      const res = await fetch("/upload", {
        method: "POST",
        body: formData
      });

      if (!res.ok) {
        throw new Error("Upload failed");
      }

      return await res.json();
    } catch (err) {
      console.error(err);
      return null;
    }
  }
</script>

</html>
