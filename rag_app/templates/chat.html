<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG System Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
  <main class="app-shell">
    <aside class="history-panel" aria-label="Chat history">
      <div class="history-header">
        <h2>History</h2>
        <button class="new-chat-btn" type="button" id="new-chat-btn" aria-label="New chat">
          <i class="fa-solid fa-plus"></i>
        </button>
      </div>
      <div class="history-list" id="history-list"></div>
    </aside>

    <section class="chat-shell">
      <header class="chat-header">
        <div class="brand">
          <div class="brand-icon">
            <img src="{{ url_for('static', filename='images/agga_icon.png') }}" alt="AGGA Assistant icon">
          </div>
          <div>
            <h1>AGGA Assistant</h1>
            <p>Ask questions, search context, and get grounded answers.</p>
          </div>
        </div>
      </header>


      <!-- CHAT BODY  -->
      <section class="chat-body" id="chat-body">
        <article class="message bot">
          <div class="avatar">
            <img src="{{ url_for('static', filename='images/agga_icon.png') }}" alt="AGGA Assistant icon">
          </div>
          <div class="bubble">
            Hello, How can I help you?
          </div>
        </article>
      </section>

      <footer class="chat-input">
        <form class="upload-panel" id="upload-panel" enctype="multipart/form-data">
          <div class="upload-panel-header">
            <div>
              <strong>Upload a file</strong>
              <p>Select a document to send with the chat session.</p>
            </div>
            <button class="close-upload-btn" type="button" id="close-upload-panel" aria-label="Close upload panel">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>

          <div class="upload-panel-body">
            <label class="file-picker" for="chat-file">
              <i class="fa-solid fa-file-arrow-up"></i>
              <span id="file-name">Choose a file</span>
            </label>
            <input type="file" id="chat-file" name="document" hidden>
            <button class="upload-btn" type="submit" id="upload-btn">Upload file</button>
          </div>
        </form>

        <form class="input-row">
          <button class="icon-btn" type="button" aria-label="Attach file" id="toggle-upload-panel" aria-expanded="false">
            <i class="fa-solid fa-paperclip"></i>
          </button>
          <input type="text" placeholder="Type your question here..." id="chat_message">
          <button class="send-btn" type="submit" aria-label="Send message" id="ask_message">
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </form>
      </footer>
    </section>
  </main>
</body>

<script>
  const chatForm = document.querySelector(".input-row");
  const chatBody = document.getElementById("chat-body");
  const chatMessageInput = document.getElementById("chat_message");
  const askButton = document.getElementById("ask_message");
  const askButtonIcon = askButton?.querySelector("i");
  const historyList = document.getElementById("history-list");
  const newChatButton = document.getElementById("new-chat-btn");
  const uploadPanel = document.getElementById("upload-panel");
  const toggleUploadPanelButton = document.getElementById("toggle-upload-panel");
  const closeUploadPanelButton = document.getElementById("close-upload-panel");
  const fileInput = document.getElementById("chat-file");
  const fileName = document.getElementById("file-name");
  const uploadButton = document.getElementById("upload-btn");
  const assistantAvatarSrc = "{{ url_for('static', filename='images/agga_icon.png') }}";
  let isAsking = false;
  let activeAskToken = 0;
  let activeThinkingEl = null;
  let activeAskController = null;
  const SESSION_STORAGE_KEY = "agga_chat_sessions_v1";
  const ACTIVE_SESSION_STORAGE_KEY = "agga_chat_active_session_v1";
  let sessions = [];
  let activeSessionId = null;

  function generateId() {
    return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
  }

  function loadSessions() {
    try {
      const raw = localStorage.getItem(SESSION_STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch (err) {
      console.error(err);
      return [];
    }
  }

  function saveSessions(nextSessions) {
    try {
      localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(nextSessions));
    } catch (err) {
      console.error(err);
    }
  }

  function loadActiveSessionId() {
    try {
      return localStorage.getItem(ACTIVE_SESSION_STORAGE_KEY);
    } catch {
      return null;
    }
  }

  function saveActiveSessionId(sessionId) {
    try {
      localStorage.setItem(ACTIVE_SESSION_STORAGE_KEY, sessionId);
    } catch (err) {
      console.error(err);
    }
  }

  function getSessionById(sessionId) {
    return sessions.find((session) => session.id === sessionId) || null;
  }

  function updateSession(sessionId, updater) {
    sessions = sessions.map((session) => {
      if (session.id !== sessionId) {
        return session;
      }
      const updated = updater({ ...session });
      return updated;
    });
    saveSessions(sessions);
  }

  function formatRelativeTime(timestamp) {
    if (!timestamp) {
      return "";
    }
    const diffMs = Date.now() - timestamp;
    const diffMinutes = Math.floor(diffMs / 60000);
    if (diffMinutes < 1) return "just now";
    if (diffMinutes < 60) return `${diffMinutes}m ago`;
    const diffHours = Math.floor(diffMinutes / 60);
    if (diffHours < 24) return `${diffHours}h ago`;
    const diffDays = Math.floor(diffHours / 24);
    return `${diffDays}d ago`;
  }

  function renderHistory() {
    if (!historyList) {
      return;
    }
    historyList.innerHTML = "";

    const ordered = [...sessions].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    ordered.forEach((session) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = `history-item${session.id === activeSessionId ? " is-active" : ""}`;
      button.dataset.sessionId = session.id;

      const title = document.createElement("div");
      title.className = "history-title";
      title.textContent = session.title || "New chat";

      const meta = document.createElement("div");
      meta.className = "history-meta";
      meta.textContent = formatRelativeTime(session.updatedAt);

      button.appendChild(title);
      button.appendChild(meta);
      historyList.appendChild(button);
    });
  }

  function clearChat() {
    chatBody.innerHTML = "";
  }

  function renderChatFromSession(sessionId) {
    const session = getSessionById(sessionId);
    if (!session) {
      return;
    }

    activeSessionId = sessionId;
    saveActiveSessionId(sessionId);
    renderHistory();

    clearChat();
    (session.messages || []).forEach((item) => {
      appendMessage(item.role, item.text, { persist: false });
    });
    chatBody.scrollTop = chatBody.scrollHeight;
  }

  function createSession({ seedMessages = [] } = {}) {
    const now = Date.now();
    const session = {
      id: generateId(),
      title: "New chat",
      createdAt: now,
      updatedAt: now,
      messages: seedMessages
    };
    sessions = [session, ...sessions];
    saveSessions(sessions);
    activeSessionId = session.id;
    saveActiveSessionId(session.id);
    renderHistory();
    return session;
  }

  function seedMessagesFromDom() {
    const articles = chatBody.querySelectorAll("article.message");
    const messages = [];
    articles.forEach((article) => {
      const role = article.classList.contains("user") ? "user" : "bot";
      const bubble = article.querySelector(".bubble");
      const text = bubble ? (bubble.textContent || "").trim() : "";
      if (text) {
        messages.push({ role, text, ts: Date.now() });
      }
    });
    return messages;
  }

  function setUploadPanelState(isOpen) {
    uploadPanel.classList.toggle("is-open", isOpen);
    toggleUploadPanelButton.setAttribute("aria-expanded", isOpen ? "true" : "false");
  }

  function setChatBusy(isBusy) {
    chatMessageInput.disabled = isBusy;
    toggleUploadPanelButton.disabled = isBusy;

    if (askButton) {
      askButton.setAttribute("aria-label", isBusy ? "Stop generating" : "Send message");
    }
    if (askButtonIcon) {
      askButtonIcon.className = isBusy ? "fa-solid fa-stop" : "fa-solid fa-paper-plane";
    }
  }

  function appendMessage(role, message, options = {}) {
    const shouldPersist = options.persist !== false;
    const article = document.createElement("article");
    article.className = `message ${role}`;

    const avatar = document.createElement("div");
    avatar.className = "avatar";

    if (role === "user") {
      const icon = document.createElement("i");
      icon.className = "fa-solid fa-user";
      avatar.appendChild(icon);
    } else {
      const image = document.createElement("img");
      image.src = assistantAvatarSrc;
      image.alt = "AGGA Assistant icon";
      avatar.appendChild(image);
    }

  

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = message;

    article.appendChild(avatar);
    article.appendChild(bubble);

    chatBody.appendChild(article);
    chatBody.scrollTop = chatBody.scrollHeight;

    if (shouldPersist && activeSessionId) {
      const now = Date.now();
      updateSession(activeSessionId, (session) => {
        const nextMessages = Array.isArray(session.messages) ? [...session.messages] : [];
        nextMessages.push({ role, text: message, ts: now });
        const nextTitle =
          session.title === "New chat" && role === "user" && message
            ? message.slice(0, 42)
            : session.title;
        return {
          ...session,
          title: nextTitle,
          messages: nextMessages,
          updatedAt: now
        };
      });
      renderHistory();
    }
  }

  function appendThinking() {
    const article = document.createElement("article");
    article.className = "message bot";

    const avatar = document.createElement("div");
    avatar.className = "avatar";

    const image = document.createElement("img");
    image.src = assistantAvatarSrc;
    image.alt = "AGGA Assistant icon";
    avatar.appendChild(image);

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    const dots = document.createElement("div");
    dots.className = "thinking-dots";
    for (let i = 0; i < 3; i += 1) {
      dots.appendChild(document.createElement("span"));
    }

    bubble.appendChild(dots);
    article.appendChild(avatar);
    article.appendChild(bubble);

    chatBody.appendChild(article);
    chatBody.scrollTop = chatBody.scrollHeight;

    return article;
  }

  function stopCurrentAsk() {
    if (!isAsking) {
      return;
    }

    activeAskToken += 1;
    isAsking = false;

    if (activeAskController && !activeAskController.signal.aborted) {
      activeAskController.abort();
    }
    activeAskController = null;

    if (activeThinkingEl && activeThinkingEl.isConnected) {
      activeThinkingEl.remove();
    }
    activeThinkingEl = null;

    setChatBusy(false);
  }

  function newChat() {
    stopCurrentAsk();
    setUploadPanelState(false);

    const greeting = "Hello, How can I help you?";
    const session = createSession({
      seedMessages: [{ role: "bot", text: greeting, ts: Date.now() }]
    });
    renderChatFromSession(session.id);
  }

  toggleUploadPanelButton.addEventListener("click", () => {
    const shouldOpen = !uploadPanel.classList.contains("is-open");
    setUploadPanelState(shouldOpen);
  });

  closeUploadPanelButton.addEventListener("click", () => {
    setUploadPanelState(false);
  });

  fileInput.addEventListener("change", () => {
    fileName.textContent = fileInput.files.length ? fileInput.files[0].name : "Choose a file";
  });

  uploadPanel.addEventListener("submit", async (e) => {
    e.preventDefault();

    if (isAsking) {
      appendMessage("bot", "Please stop or wait for the current response before uploading.");
      return;
    }

    if (!fileInput.files.length) {
      appendMessage("bot", "Please choose a file before uploading.");
      return;
    }

    const selectedFile = fileInput.files[0];
    const formData = new FormData();
    formData.append("document", selectedFile);

    uploadButton.disabled = true;
    uploadButton.textContent = "Uploading...";

    const result = await uploadFile(formData);

    uploadButton.disabled = false;
    uploadButton.textContent = "Upload file";

    if (result && result.status === "Success") {
      appendMessage("user", `Uploaded file: ${selectedFile.name}`);
      appendMessage("bot", result.message);
      uploadPanel.reset();
      fileName.textContent = "Choose a file";
      setUploadPanelState(false);
      return;
    }

    appendMessage("bot", "Sorry, the file upload failed.");
  });

  chatForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    if (isAsking) {
      stopCurrentAsk();
      return;
    }

    const message = chatMessageInput.value.trim();

    if (!message) {
      return;
    }

    appendMessage("user", message);
    chatMessageInput.value = "";

    const payload = {
      message: message
    };

    isAsking = true;
    const token = (activeAskToken += 1);
    const controller = new AbortController();

    activeAskController = controller;
    activeThinkingEl = appendThinking();
    setChatBusy(true);

    let result = null;
    try {
      result = await go_ask(payload, controller.signal);
    } finally {
      if (token === activeAskToken) {
        isAsking = false;
        activeAskController = null;
        setChatBusy(false);

        if (activeThinkingEl && activeThinkingEl.isConnected) {
          activeThinkingEl.remove();
        }
        activeThinkingEl = null;
      }
    }

    if (controller.signal.aborted) {
      return;
    }
    if (result && result.status === "Success") {
      appendMessage("bot", result.response);
    } else {
      appendMessage("bot", "Sorry, I couldn't get a response right now.");
    }
  });

  if (historyList) {
    historyList.addEventListener("click", (e) => {
      const target = e.target?.closest?.("button[data-session-id]");
      const sessionId = target?.dataset?.sessionId;
      if (!sessionId) {
        return;
      }
      if (sessionId === activeSessionId) {
        return;
      }
      stopCurrentAsk();
      setUploadPanelState(false);
      renderChatFromSession(sessionId);
    });
  }

  if (newChatButton) {
    newChatButton.addEventListener("click", () => {
      newChat();
    });
  }

  // Bootstrap history state.
  sessions = loadSessions();
  const storedActiveId = loadActiveSessionId();
  if (!sessions.length) {
    const seedMessages = seedMessagesFromDom();
    const session = createSession({ seedMessages });
    renderChatFromSession(session.id);
  } else {
    const fallbackId = sessions[0].id;
    const initialId = (storedActiveId && getSessionById(storedActiveId) && storedActiveId) || fallbackId;
    renderChatFromSession(initialId);
  }


  async function go_ask(payload, signal) {
    try {
      const res = await fetch("/ask", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload),
        signal
      });

      // check error
      if (!res.ok) {
        throw new Error("Request failed");
      }

      return await res.json();

    } catch (err) {
      if (err && err.name === "AbortError") {
        return null;
      }
      console.error(err);
      return null;
    }
  }

  async function uploadFile(formData) {
    try {
      const res = await fetch("/upload", {
        method: "POST",
        body: formData
      });

      if (!res.ok) {
        throw new Error("Upload failed");
      }

      return await res.json();
    } catch (err) {
      console.error(err);
      return null;
    }
  }
</script>

</html>
